<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>醒香微醺 SoberBloom | 零酒精精釀基底與頂級微醺體驗</title>
  <style>
    :root {
      --color-primary: #D4AF37;
      --color-primary-hover: #B89628;
      --color-secondary: #71717A;
      --color-bg: #09090B;
      --color-surface: #18181B;
      --color-surface-border: #27272A;
      --color-text-main: #F4F4F5;
      --color-text-muted: #A1A1AA;
      --color-accent: #E5C158;
      --radius-badge: 4px;
      --radius-card: 8px;
      --radius-button: 8px;
      --radius-input: 6px;
      --shadow-card: 0 8px 30px rgba(0,0,0,0.7), 0 0 1px 1px rgba(212,175,55,0.2);
      --shadow-modal: 0 25px 60px rgba(0,0,0,0.8);
      --shadow-glow: 0 0 20px rgba(212,175,55,0.2);
      --font-family: 'Georgia', 'Palatino Linotype', 'Times New Roman', serif, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--color-bg);
      color: var(--color-text-main);
      font-family: var(--font-family);
      line-height: 1.6;
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    canvas#bg-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }

    /* Typography Utilities */
    .tracking-widest { letter-spacing: 0.15em; }
    .text-gold { color: var(--color-primary); }
    .text-muted { color: var(--color-text-muted); }
    .font-semibold { font-weight: 600; }
    
    /* Layout Elements */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(9, 9, 11, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--color-surface-border);
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      cursor: pointer;
    }

    .brand-logo-text {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #FFF 0%, #D4AF37 50%, #E5C158 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-logo-sub {
      font-size: 0.75rem;
      color: var(--color-secondary);
      letter-spacing: 3px;
      display: block;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      list-style: none;
    }

    .nav-link {
      color: var(--color-text-muted);
      text-decoration: none;
      font-size: 0.95rem;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
      padding: 4px 0;
    }

    .nav-link:hover, .nav-link.active {
      color: var(--color-primary);
    }

    .nav-link.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--color-primary);
      box-shadow: var(--shadow-glow);
    }

    .cart-btn {
      position: relative;
      background: transparent;
      border: 1px solid var(--color-primary);
      color: var(--color-primary);
      padding: 8px 16px;
      border-radius: var(--radius-button);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .cart-btn:hover {
      background: var(--color-primary);
      color: #000;
      transform: translateY(-2px);
      box-shadow: var(--shadow-glow);
    }

    .cart-badge {
      background: var(--color-accent);
      color: #000;
      font-size: 0.75rem;
      font-weight: bold;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* Hero Section */
    .hero-section {
      text-align: center;
      padding: 4rem 1rem 3rem;
      background: radial-gradient(circle at center, rgba(212, 175, 55, 0.08) 0%, rgba(9, 9, 11, 0) 70%);
      border-radius: var(--radius-card);
      border: 1px solid rgba(212, 175, 55, 0.15);
      margin-bottom: 3rem;
    }

    .hero-title {
      font-size: 2.8rem;
      color: var(--color-primary);
      letter-spacing: 3px;
      margin-bottom: 1rem;
      text-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
    }

    .hero-desc {
      max-width: 750px;
      margin: 0 auto 2rem;
      color: var(--color-text-main);
      font-size: 1.1rem;
      line-height: 1.8;
    }

    .btn-primary {
      background: linear-gradient(135deg, #D4AF37 0%, #B89628 100%);
      color: #000;
      font-weight: 600;
      border: none;
      padding: 12px 28px;
      border-radius: var(--radius-button);
      cursor: pointer;
      font-size: 1rem;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      box-shadow: var(--shadow-card);
      display: inline-block;
      text-decoration: none;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
      background: linear-gradient(135deg, #E5C158 0%, #D4AF37 100%);
    }

    .btn-primary:disabled {
      background: var(--color-secondary);
      color: #666;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--color-surface-border);
      color: var(--color-text-main);
      padding: 10px 20px;
      border-radius: var(--radius-button);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-outline:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    /* Product Cards & Grids */
    .section-title {
      font-size: 1.8rem;
      color: var(--color-primary);
      margin-bottom: 1.5rem;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 24px;
      background: var(--color-primary);
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 2rem;
      margin-bottom: 3rem;
    }

    .product-card {
      background: var(--color-surface);
      border: 1px solid var(--color-surface-border);
      border-radius: var(--radius-card);
      overflow: hidden;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-4px);
      border-color: rgba(212, 175, 55, 0.4);
      box-shadow: var(--shadow-card);
    }

    .product-img-wrapper {
      width: 100%;
      height: 240px;
      background: #121214;
      overflow: hidden;
      position: relative;
      cursor: pointer;
    }

    .product-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .product-card:hover .product-img {
      transform: scale(1.05);
    }

    .product-info {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .product-category {
      font-size: 0.75rem;
      color: var(--color-primary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .product-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--color-text-main);
      margin-bottom: 8px;
      cursor: pointer;
    }

    .product-name:hover {
      color: var(--color-accent);
    }

    .product-price {
      font-size: 1.2rem;
      color: var(--color-accent);
      font-weight: bold;
      margin-bottom: 1rem;
    }

    .stock-badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: var(--radius-badge);
      display: inline-block;
      margin-bottom: 1rem;
      width: fit-content;
    }

    .stock-in { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
    .stock-out { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

    .card-actions {
      margin-top: auto;
      display: flex;
      gap: 8px;
    }

    .card-actions button {
      flex: 1;
      padding: 8px;
      font-size: 0.85rem;
    }

    /* Controls Bar (Filter / Search) */
    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      background: var(--color-surface);
      padding: 1rem;
      border-radius: var(--radius-card);
      border: 1px solid var(--color-surface-border);
    }

    .search-box {
      display: flex;
      align-items: center;
      background: var(--color-bg);
      border: 1px solid var(--color-surface-border);
      border-radius: var(--radius-input);
      padding: 6px 12px;
      width: 100%;
      max-width: 320px;
    }

    .search-box input {
      background: transparent;
      border: none;
      color: var(--color-text-main);
      outline: none;
      width: 100%;
      padding-left: 8px;
    }

    .category-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      background: var(--color-bg);
      border: 1px solid var(--color-surface-border);
      color: var(--color-text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .chip:hover, .chip.active {
      border-color: var(--color-primary);
      color: var(--color-primary);
      background: rgba(212, 175, 55, 0.08);
    }

    /* Detailed Modal / View */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--color-surface);
      border: 1px solid var(--color-surface-border);
      border-radius: var(--radius-card);
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-modal);
      position: relative;
      padding: 2rem;
    }

    .modal-close {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      background: transparent;
      border: none;
      color: var(--color-text-muted);
      font-size: 1.8rem;
      cursor: pointer;
    }

    .modal-close:hover { color: var(--color-primary); }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    @media (max-width: 768px) {
      .detail-grid { grid-template-columns: 1fr; }
    }

    .detail-main-img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      border-radius: var(--radius-card);
      border: 1px solid var(--color-surface-border);
    }

    .detail-thumbs {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      overflow-x: auto;
    }

    .detail-thumb {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .detail-thumb.active {
      border-color: var(--color-primary);
    }

    .qty-picker {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 1.5rem 0;
    }

    .qty-btn {
      width: 32px;
      height: 32px;
      background: var(--color-bg);
      border: 1px solid var(--color-surface-border);
      color: var(--color-text-main);
      border-radius: 4px;
      cursor: pointer;
    }

    .qty-input {
      width: 50px;
      text-align: center;
      background: var(--color-bg);
      border: 1px solid var(--color-surface-border);
      color: var(--color-text-main);
      padding: 4px;
      border-radius: 4px;
    }

    /* Dynamic Photo Gallery (About Us) */
    .story-card {
      background: var(--color-surface);
      border: 1px solid var(--color-surface-border);
      border-radius: var(--radius-card);
      padding: 2.5rem;
      margin-bottom: 3rem;
      position: relative;
    }

    .story-card::after {
      content: '0% ALCOHOL';
      position: absolute;
      bottom: 1rem;
      right: 1.5rem;
      font-size: 3rem;
      font-weight: 900;
      color: rgba(212, 175, 55, 0.04);
      pointer-events: none;
    }

    /* Photo Gallery Layouts */
    .gallery-container {
      display: grid;
      gap: 16px;
      margin-top: 1.5rem;
    }

    /* Layout 3 items */
    .gallery-layout-3 {
      display: grid;
      grid-template-columns: 60% 1fr;
      gap: 16px;
    }

    .gallery-layout-3 .right-stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Layout 4+ Hybrid dense grid */
    .gallery-layout-hybrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      grid-auto-flow: dense;
      gap: 16px;
    }

    .gallery-item {
      position: relative;
      border-radius: var(--radius-card);
      overflow: hidden;
      cursor: pointer;
      background: var(--color-surface-border);
      height: 220px;
    }

    .gallery-item.landscape { grid-column: span 2; }
    .gallery-item.portrait { grid-row: span 2; height: 456px; }

    .gallery-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .gallery-item:hover .gallery-img {
      transform: scale(1.04);
    }

    /* Lightbox Modal */
    .lightbox-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.95);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .lightbox-modal.active {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 0 30px rgba(0,0,0,0.9);
    }

    /* Cart Drawer / Modal */
    .cart-drawer {
      position: fixed;
      top: 0;
      right: -450px;
      width: 100%;
      max-width: 440px;
      height: 100vh;
      background: var(--color-surface);
      border-left: 1px solid var(--color-surface-border);
      z-index: 1100;
      transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-modal);
    }

    .cart-drawer.active {
      right: 0;
    }

    .cart-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--color-surface-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart-body {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
    }

    .cart-item {
      display: flex;
      gap: 12px;
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .cart-item-img {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 4px;
    }

    .cart-footer {
      padding: 1.5rem;
      border-top: 1px solid var(--color-surface-border);
      background: #121214;
    }

    .upsell-box {
      background: rgba(212, 175, 55, 0.08);
      border: 1px dashed var(--color-primary);
      padding: 12px;
      border-radius: var(--radius-card);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .free-shipping-bar {
      margin-bottom: 1rem;
      font-size: 0.85rem;
    }

    .progress-track {
      height: 6px;
      background: var(--color-surface-border);
      border-radius: 3px;
      overflow: hidden;
      margin-top: 4px;
    }

    .progress-fill {
      height: 100%;
      background: var(--color-primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 1rem;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      color: var(--color-text-muted);
      margin-bottom: 4px;
    }

    .form-input {
      width: 100%;
      padding: 10px 12px;
      background: var(--color-bg);
      border: 1px solid var(--color-surface-border);
      color: var(--color-text-main);
      border-radius: var(--radius-input);
      outline: none;
    }

    .form-input:focus {
      border-color: var(--color-primary);
    }

    /* Contact Links */
    .contact-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.5rem;
      margin-bottom: 3rem;
    }

    .contact-card {
      background: var(--color-surface);
      border: 1px solid var(--color-surface-border);
      padding: 1.5rem;
      border-radius: var(--radius-card);
      text-decoration: none;
      color: var(--color-text-main);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .contact-card:hover {
      border-color: var(--color-primary);
      transform: translateY(-2px);
    }

    .contact-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-primary);
      flex-shrink: 0;
    }

    /* Footer */
    footer {
      border-top: 1px solid var(--color-surface-border);
      background: #050507;
      padding: 2.5rem 1.5rem;
      text-align: center;
      margin-top: auto;
    }

    footer a {
      color: var(--color-primary);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    /* Loader */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(0,0,0,0.3);
      border-radius: 50%;
      border-top-color: #000;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* RWD Support */
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .hero-title { font-size: 2rem; }
      .gallery-layout-3 { grid-template-columns: 1fr; }
      .gallery-item.landscape, .gallery-item.portrait { grid-column: span 1; grid-row: span 1; height: 240px; }
    }
  </style>
</head>
<body>

  <!-- Canvas Interactive Background -->
  <canvas id="bg-canvas"></canvas>

  <!-- Navbar -->
  <header>
    <div class="nav-container">
      <div class="brand-logo" onclick="switchTab('home')">
        <div>
          <span class="brand-logo-text">醒香微醺</span>
          <span class="brand-logo-sub">SOBERBLOOM</span>
        </div>
      </div>
      <ul class="nav-links">
        <li><a class="nav-link active" id="nav-home" onclick="switchTab('home')">首頁</a></li>
        <li><a class="nav-link" id="nav-products" onclick="switchTab('products')">精選商品</a></li>
        <li><a class="nav-link" id="nav-about" onclick="switchTab('about')">關於我們</a></li>
        <li><a class="nav-link" id="nav-contact" onclick="switchTab('contact')">聯絡我們</a></li>
      </ul>
      <button class="cart-btn" onclick="toggleCartDrawer(true)">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
        <span>購物車</span>
        <span class="cart-badge" id="cart-count">0</span>
      </button>
    </div>
  </header>

  <!-- Main Content Container -->
  <main id="app-content">
    <!-- Views injected dynamically -->
  </main>

  <!-- Lightbox Modal -->
  <div class="lightbox-modal" id="lightbox-modal" onclick="closeLightbox()">
    <img id="lightbox-img" class="lightbox-img" src="" alt="Full view">
  </div>

  <!-- Product Detail Modal -->
  <div class="modal-overlay" id="product-modal">
    <div class="modal-content" id="product-modal-content">
      <!-- Injected by JS -->
    </div>
  </div>

  <!-- Cart Drawer -->
  <div class="cart-drawer" id="cart-drawer">
    <div class="cart-header">
      <h3 style="color: var(--color-primary); font-size: 1.2rem;">購物車與結帳</h3>
      <button class="modal-close" onclick="toggleCartDrawer(false)" style="position:static;">&times;</button>
    </div>
    <div class="cart-body" id="cart-items-container">
      <!-- Cart items injected here -->
    </div>
    <div class="cart-footer">
      <div id="cart-summary-area"></div>
    </div>
  </div>

  <!-- Bank Transfer Modal -->
  <div class="modal-overlay" id="bank-modal">
    <div class="modal-content" style="max-width: 500px; text-align: center;">

  <script>

    const state = {

    // --- CANVAS ANIMATION SYSTEM ---
    (function initCanvas() {
      const canvas = document.getElementById('bg-canvas');
      const ctx = canvas.getContext('2d');
      let width, height;
      let particles = [];
      let mouse = { x: null, y: null };

      function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      }

      window.addEventListener('resize', resize);
      resize();

      window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
      });

      const colors = ["rgba(212,175,55,0.25)", "rgba(229,193,88,0.18)", "rgba(113,113,122,0.15)"];

      for (let i = 0; i < 40; i++) {
        particles.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 2 + 1,
          color: colors[Math.floor(Math.random() * colors.length)],
          angle: Math.random() * Math.PI * 2,
          speed: Math.random() * 0.3 + 0.1,
          orbit: Math.random() * 100 + 50
        });
      }

      function animate() {
        ctx.clearRect(0, 0, width, height);

        // Draw Subtle Gold Rays
        const gradient = ctx.createRadialGradient(
          mouse.x || width / 2, mouse.y || height / 2, 10,
          mouse.x || width / 2, mouse.y || height / 2, Math.max(width, height) * 0.6
        );
        gradient.addColorStop(0, 'rgba(212, 175, 55, 0.05)');
        gradient.addColorStop(1, 'rgba(9, 9, 11, 0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        particles.forEach(p => {
          p.angle += p.speed * 0.01;
          p.x += Math.cos(p.angle) * p.speed;
          p.y += Math.sin(p.angle) * p.speed;

          if (p.x < 0) p.x = width;
          if (p.x > width) p.x = 0;
          if (p.y < 0) p.y = height;
          if (p.y > height) p.y = 0;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.fill();

          // Connect cursor rays softly
          if (mouse.x && mouse.y) {
            const dx = mouse.x - p.x;
            const dy = mouse.y - p.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 150) {
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(mouse.x, mouse.y);
              ctx.strokeStyle = `rgba(212, 175, 55, ${0.12 * (1 - dist / 150)})`;
              ctx.stroke();
            }
          }
        });

        requestAnimationFrame(animate);
      }
      animate();
    })();

    // --- API HELPER FUNCTIONS ---
    async function apiFetch(endpoint, options = {}) {
      const url = `${API_BASE}${endpoint}`;
      const config = {
        ...options,
        headers: { ...HEADERS, ...(options.headers || {}) }
      };
      const res = await fetch(url, config);
      if (!res.ok) throw new Error(`API Error: ${res.status}`);
      return await res.json();
    }

    // Lazy load shop info in background
    async function loadShopInfoIfNeeded() {
      if (!state.shopInfo) {
        try {
          state.shopInfo = await apiFetch('/api/shop-info');
          updateCartView();
        } catch (e) {
          console.error("Failed to load shop info", e);
        }
      }
    }

    // --- RENDER APP VIEWS ---
    function updateCartBadge() {
      const totalCount = state.cart.reduce((sum, item) => sum + item.qty, 0);
      document.getElementById('cart-count').innerText = totalCount;
      localStorage.setItem('soberbloom_cart', JSON.stringify(state.cart));
    }

    function switchTab(tab) {
      state.currentTab = tab;
      document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
      const activeNav = document.getElementById(`nav-${tab}`);
      if (activeNav) activeNav.classList.add('active');

      const content = document.getElementById('app-content');

      if (tab === 'home') renderHome(content);
      else if (tab === 'products') renderProductsPage(content);
      else if (tab === 'about') renderAboutPage(content);
      else if (tab === 'contact') renderContactPage(content);

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // --- PAGE 1: HOME ---
    async function renderHome(container) {
      container.innerHTML = `
        <section class="hero-section">
          <span style="color: var(--color-primary); font-size: 0.9rem; letter-spacing: 3px;" class="tracking-widest font-semibold">0% ALCOHOL ARTISAN BEVERAGES</span>
          <h1 class="hero-title" style="margin-top: 10px;">${BRAND.name} ${BRAND.enName}</h1>
          <p class="hero-desc">${BRAND.desc}</p>
          <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
            <button class="btn-primary" onclick="switchTab('products')">探索零酒精奢華調香</button>
            <button class="btn-outline" onclick="switchTab('about')">品牌零負擔理念</button>
          </div>
        </section>

        <section>
          <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 1.5rem;">

            <a onclick="switchTab('products')" style="color: var(--color-primary); cursor: pointer; font-size: 0.9rem;">查看全部商品 &rarr;</a>
          </div>
          <div class="product-grid" id="home-product-grid">
            <div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--color-text-muted);">載入最新商品中...</div>
          </div>
        </section>
      `;

      try {
        const products = await apiFetch('/api/products');
        state.products = products;
        const latest10 = products.slice(0, 10);
        const grid = document.getElementById('home-product-grid');
        if (latest10.length === 0) {
          grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--color-text-muted);">目前尚無商品</div>`;
          return;
        }
        grid.innerHTML = latest10.map(p => createProductCardHTML(p)).join('');
      } catch (err) {
        const grid = document.getElementById('home-product-grid');
        if (grid) {
          grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #f87171; padding: 2rem; border: 1px dashed #f87171; border-radius: 8px;">網頁顯示異常，請重新整理頁面。</div>`;
        }
      }

      loadShopInfoIfNeeded();
    }

    // --- PAGE 2: PRODUCTS ---
    async function renderProductsPage(container) {
      container.innerHTML = `
        <h2 class="section-title">精選全系列商品</h2>
        <div class="controls-bar">
          <div class="search-box">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color: var(--color-secondary);"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="search-input" placeholder="搜尋商品名稱或成分..." value="${state.searchQuery}">
          </div>
          <div class="category-chips" id="category-chips">
            <span class="chip ${state.selectedCategory === null ? 'active' : ''}" onclick="filterCategory(null)">全部商品</span>
          </div>
        </div>

        <div class="product-grid" id="products-page-grid">
          <div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--color-text-muted);">商品準備中...</div>
        </div>
      `;

      // Setup Search Event
      const searchInput = document.getElementById('search-input');
      let debounceTimer;
      searchInput.addEventListener('input', (e) => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
          state.searchQuery = e.target.value.trim();
          fetchFilteredProducts();
        }, 300);
      });

      // Load Categories & Products
      try {
        const [categories, products] = await Promise.all([
          apiFetch('/api/categories').catch(() => []),
          apiFetch('/api/products')
        ]);
        state.categories = categories;
        state.products = products;

        // Render Categories
        const chipsContainer = document.getElementById('category-chips');
        chipsContainer.innerHTML = `
          <span class="chip ${state.selectedCategory === null ? 'active' : ''}" onclick="filterCategory(null)">全部商品</span>
          ${categories.map(c => `
            <span class="chip ${state.selectedCategory === c.id ? 'active' : ''}" onclick="filterCategory('${c.id}')">${c.name}</span>
          `).join('')}
        `;

        renderProductsGrid(products);
      } catch (err) {
        document.getElementById('products-page-grid').innerHTML = `
          <div style="grid-column: 1/-1; text-align: center; color: #f87171; padding: 2rem;">無法載入商品資料，請重新整理頁面。</div>
        `;
      }
    }

    async function fetchFilteredProducts() {
      const grid = document.getElementById('products-page-grid');
      grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--color-text-muted);">搜尋中...</div>`;
      try {
        let endpoint = '/api/products';
        if (state.searchQuery) {
          endpoint += `?q=${encodeURIComponent(state.searchQuery)}`;
        }
        let products = await apiFetch(endpoint);
        if (state.selectedCategory) {
          products = products.filter(p => p.category_id === state.selectedCategory || p.category === state.selectedCategory);
        }
        renderProductsGrid(products);
      } catch (e) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #f87171;">搜尋時發生錯誤。</div>`;
      }
    }

    function filterCategory(catId) {
      state.selectedCategory = catId;
      document.querySelectorAll('#category-chips .chip').forEach(el => el.classList.remove('active'));
      event.target.classList.add('active');
      fetchFilteredProducts();
    }

    function renderProductsGrid(list) {
      const grid = document.getElementById('products-page-grid');
      if (!grid) return;
      if (list.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--color-text-muted); padding: 3rem;">未找到符合條件的商品。</div>`;
        return;
      }
      grid.innerHTML = list.map(p => createProductCardHTML(p)).join('');
    }

    // --- PRODUCT CARD HELPER ---
    function createProductCardHTML(p) {
      const imgUrl = (p.images && p.images.length > 0) ? p.images[0] : 'https://via.placeholder.com/300x300/18181B/D4AF37?text=SoberBloom';
      
      // Inventory calculation
      const isTracked = p.is_stock_tracked === true;
      const isSoldOut = isTracked && (p.stock_quantity === 0 || p.is_in_stock === false);
      
      let stockBadgeHTML = '';
      if (isTracked) {
        if (isSoldOut) {
          stockBadgeHTML = `<span class="stock-badge stock-out">已售完 / Out of Stock</span>`;
        } else if (p.stock_quantity > 0) {
          stockBadgeHTML = `<span class="stock-badge stock-in">剩餘 ${p.stock_quantity} 件</span>`;
        }
      }

      const disabledAttr = isSoldOut ? 'disabled' : '';

      return `
        <div class="product-card">
          <div class="product-img-wrapper" onclick="openProductDetail('${p.id}')">
            <img class="product-img" src="${imgUrl}" alt="${p.name}" loading="lazy" decoding="async">
          </div>
          <div class="product-info">
            <div class="product-category">${p.category_name || p.category || '草本精釀'}</div>
            <div class="product-name" onclick="openProductDetail('${p.id}')">${p.name}</div>
            <div class="product-price">NT$ ${Number(p.price).toLocaleString()}</div>
            ${stockBadgeHTML}
            <div class="card-actions">
              <button class="btn-outline" onclick="addToCart('${p.id}', 1)" ${disabledAttr}>加入購物車</button>
              <button class="btn-primary" onclick="buyNow('${p.id}')" ${disabledAttr}>立即購買</button>
            </div>
          </div>
        </div>
      `;
    }

    // --- PRODUCT DETAIL MODAL ---
    async function openProductDetail(id) {
      const modal = document.getElementById('product-modal');
      const container = document.getElementById('product-modal-content');
      modal.classList.add('active');
      container.innerHTML = `<div style="text-align:center; padding: 3rem; color: var(--color-text-muted);">商品詳情載入中...</div>`;

      try {
        const p = await apiFetch(`/api/products/${id}`);
        const images = (p.images && p.images.length > 0) ? p.images : ['https://via.placeholder.com/500x500/18181B/D4AF37?text=SoberBloom'];
        const isTracked = p.is_stock_tracked === true;
        const isSoldOut = isTracked && (p.stock_quantity === 0 || p.is_in_stock === false);
        const maxQty = isTracked && p.stock_quantity > 0 ? p.stock_quantity : 99;

        // Specs List HTML
        let specsHTML = '';
        if (p.specs && typeof p.specs === 'object') {
          specsHTML = `<div style="margin-top: 1rem; background: var(--color-bg); padding: 1rem; border-radius: 6px; font-size: 0.85rem;">
            <div style="color: var(--color-primary); font-weight: bold; margin-bottom: 6px;">商品規格</div>
            ${Object.entries(p.specs).map(([k, v]) => `<div><span style="color: var(--color-text-muted);">${k}:</span> ${v}</div>`).join('')}
          </div>`;
        }

        container.innerHTML = `
          <button class="modal-close" onclick="closeProductModal()">&times;</button>
          <div class="detail-grid">
            <div>
              <img id="detail-main-img" class="detail-main-img" src="${images[0]}" alt="${p.name}">
              <div class="detail-thumbs">
                ${images.map((img, idx) => `
                  <img class="detail-thumb ${idx === 0 ? 'active' : ''}" src="${img}" onclick="setDetailImage('${img}', this)">
                `).join('')}
              </div>
            </div>
            <div>
              <div class="product-category">${p.category_name || p.category || '草本精釀'}</div>
              <h2 style="font-size: 1.6rem; color: var(--color-text-main); margin-bottom: 8px;">${p.name}</h2>
              <div class="product-price" style="font-size: 1.5rem;">NT$ ${Number(p.price).toLocaleString()}</div>
              
              ${isTracked ? (isSoldOut ? `<span class="stock-badge stock-out">已售完 / Out of Stock</span>` : `<span class="stock-badge stock-in">剩餘 ${p.stock_quantity} 件</span>`) : ''}

              <p style="color: var(--color-text-muted); font-size: 0.95rem; line-height: 1.7; margin: 1rem 0;">${p.description || '無詳細說明'}</p>

              ${specsHTML}

              ${!isSoldOut ? `
                <div class="qty-picker">
                  <span style="color: var(--color-text-muted);">數量：</span>
                  <button class="qty-btn" onclick="adjustDetailQty(-1)">-</button>
                  <input type="number" id="detail-qty-input" class="qty-input" value="1" min="1" max="${maxQty}" readonly>
                  <button class="qty-btn" onclick="adjustDetailQty(1, ${maxQty})">+</button>
                </div>
                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                  <button class="btn-primary" style="flex:1;" onclick="addToCartFromDetail('${p.id}')">加入購物車</button>
                </div>
              ` : `
                <button class="btn-primary" style="width:100%; margin-top: 1.5rem;" disabled>商品已售完</button>
              `}
            </div>
          </div>
        `;

        state.currentDetailProduct = p;
      } catch (err) {
        container.innerHTML = `<button class="modal-close" onclick="closeProductModal()">&times;</button><div style="text-align:center; color: #f87171; padding: 2rem;">無法取得商品詳細資訊</div>`;
      }
    }

    function setDetailImage(src, thumbEl) {
      document.getElementById('detail-main-img').src = src;
      document.querySelectorAll('.detail-thumb').forEach(t => t.classList.remove('active'));
      thumbEl.classList.add('active');
    }

    function adjustDetailQty(delta, max = 99) {
      const input = document.getElementById('detail-qty-input');
      let val = parseInt(input.value) + delta;
      if (val < 1) val = 1;
      if (val > max) val = max;
      input.value = val;
    }

    function closeProductModal() {
      document.getElementById('product-modal').classList.remove('active');
    }

    // --- PAGE 3: ABOUT US (Dynamic Photo Gallery) ---
    async function renderAboutPage(container) {
      container.innerHTML = `
        <h2 class="section-title">關於 ${BRAND.name}</h2>
        
        <div class="story-card">
          <h3 style="color: var(--color-primary); font-size: 1.4rem; margin-bottom: 1rem;">清醒，也能盡情享受生活的曼妙層次</h3>
          <p style="white-space: pre-line; color: var(--color-text-main); font-size: 1.05rem; line-height: 1.9;">${BRAND.story}</p>
        </div>

        <h3 class="section-title" style="font-size: 1.4rem;">商店奢華氛圍相片</h3>
        <div id="gallery-root">
          <div style="text-align: center; padding: 2rem; color: var(--color-text-muted);">畫廊載入中...</div>
        </div>
      `;

      loadShopInfoIfNeeded();

      // Fetch Gallery photos
      try {
        const shopData = state.shopInfo || await apiFetch('/api/shop-info');
        state.shopInfo = shopData;
        
        let photos = [];
        if (shopData.photos && shopData.photos.length > 0) {
          photos = shopData.photos;
        } else if (shopData.shop_photo_url) {
          photos = [shopData.shop_photo_url];
        }

        // Fallback photos if empty
        if (photos.length === 0) {
          photos = [
            'https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&w=800&q=80',
            'https://images.unsplash.com/photo-1551024709-8f23befc6f87?auto=format&fit=crop&w=800&q=80',
            'https://images.unsplash.com/photo-1536935338788-846bb9981813?auto=format&fit=crop&w=800&q=80'
          ];
        }

        renderDynamicGallery(photos);
      } catch (e) {
        document.getElementById('gallery-root').innerHTML = `<div style="color: var(--color-text-muted);">畫廊圖片準備中...</div>`;
      }
    }

    // Photo Orientation Detector & Layout Builder
    async function renderDynamicGallery(photos) {
      const root = document.getElementById('gallery-root');
      if (!root) return;

      // Analyze image aspect ratios
      const photoObjects = await Promise.all(photos.map(url => new Promise(resolve => {
        const img = new Image();
        img.onload = () => {
          const ratio = img.width / img.height;
          let orientation = 'square';
          if (ratio > 1.15) orientation = 'landscape';
          else if (ratio < 0.87) orientation = 'portrait';
          resolve({ url, orientation, ratio });
        };
        img.onerror = () => resolve({ url, orientation: 'square', ratio: 1 });
        img.src = url;
      })));

      let galleryHTML = '';

      if (photoObjects.length === 3) {
        // Feature Left 60% + Right Stack 40%
        galleryHTML = `
          <div class="gallery-layout-3">
            <div class="gallery-item" style="height: 100%; min-height: 320px;" onclick="openLightbox('${photoObjects[0].url}')">
              <img class="gallery-img" src="${photoObjects[0].url}" loading="lazy" decoding="async">
            </div>
            <div class="right-stack">
              <div class="gallery-item" style="height: 155px;" onclick="openLightbox('${photoObjects[1].url}')">
                <img class="gallery-img" src="${photoObjects[1].url}" loading="lazy" decoding="async">
              </div>
              <div class="gallery-item" style="height: 155px;" onclick="openLightbox('${photoObjects[2].url}')">
                <img class="gallery-img" src="${photoObjects[2].url}" loading="lazy" decoding="async">
              </div>
            </div>
          </div>
        `;
      } else {
        // 1, 2, or 4+ images -> Hybrid Grid
        galleryHTML = `
          <div class="gallery-layout-hybrid">
            ${photoObjects.map(p => `
              <div class="gallery-item ${p.orientation}" onclick="openLightbox('${p.url}')">
                <img class="gallery-img" src="${p.url}" loading="lazy" decoding="async">
              </div>
            `).join('')}
          </div>
        `;
      }

      root.innerHTML = galleryHTML;
    }

    function openLightbox(url) {
      document.getElementById('lightbox-img').src = url;
      document.getElementById('lightbox-modal').classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox-modal').classList.remove('active');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLightbox();
    });

    // --- PAGE 4: CONTACT US ---
    async function renderContactPage(container) {
      container.innerHTML = `
        <h2 class="section-title">聯絡我們</h2>
        
        <div class="contact-grid" id="contact-info-grid">
          <div style="grid-column: 1/-1; color: var(--color-text-muted);">載入聯絡資訊中...</div>
        </div>

        <div style="background: var(--color-surface); border: 1px solid var(--color-surface-border); border-radius: var(--radius-card); padding: 2rem;">
          <h3 style="color: var(--color-primary); margin-bottom: 1.5rem;">尊榮專屬留言諮詢</h3>
          <form id="contact-form" onsubmit="handleContactSubmit(event)">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
              <div class="form-group">
                <label class="form-label">姓名 *</label>
                <input type="text" class="form-input" name="name" required placeholder="您的貴姓大名">
              </div>
              <div class="form-group">
                <label class="form-label">Email *</label>
                <input type="email" class="form-input" name="email" required placeholder="example@domain.com">
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">電話 (選填)</label>
              <input type="tel" class="form-input" name="phone" placeholder="0912345678">
            </div>
            <div class="form-group">
              <label class="form-label">需求與諮詢描述 (最多500字)</label>
              <textarea class="form-input" name="description" rows="5" maxlength="500" placeholder="請填寫您感興趣的精釀商品或合作需求..."></textarea>
            </div>
            <button type="submit" id="contact-submit-btn" class="btn-primary" style="width: 100%;">送出訊息</button>
          </form>
        </div>
      `;

      try {
        const infoList = await apiFetch('/api/contact-info');
        const grid = document.getElementById('contact-info-grid');
        
        if (!infoList || infoList.length === 0) {
          grid.innerHTML = `<div style="color: var(--color-text-muted);">尚無詳細聯絡資訊</div>`;
          return;
        }

        grid.innerHTML = infoList.map(item => {
          let href = '#';
          let iconSVG = '';
          let title = item.type;

          if (item.type === 'email') {
            title = '客服信箱';
            href = `mailto:${item.value}`;
            iconSVG = `<svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>`;
          } else if (item.type === 'phone') {
            title = '專線電話';
            href = `tel:${item.value}`;
            iconSVG = `<svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>`;
          } else if (item.type === 'line') {
            title = 'LINE 官方帳號';
            href = item.value.startsWith('http') ? item.value : `https://line.me/R/ti/p/${item.value}`;
            iconSVG = `<svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>`;
          } else if (item.type === 'address') {
            title = '門市地址';
            href = `https://maps.google.com/?q=${encodeURIComponent(item.value)}`;
            iconSVG = `<svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>`;
          } else if (item.type === 'line_qr') {
            title = 'LINE QR Code';
            return `<div class="contact-card"><div class="contact-icon"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg></div><div><div style="font-size: 0.8rem; color: var(--color-text-muted);">${title}</div><img src="${item.value}" style="max-width: 120px; border-radius: 4px; margin-top: 4px;"></div></div>`;
          }

          return `
            <a href="${href}" target="_blank" class="contact-card">
              <div class="contact-icon">${iconSVG}</div>
              <div>
                <div style="font-size: 0.8rem; color: var(--color-text-muted);">${title}</div>
                <div style="font-weight: 600; font-size: 1rem; color: var(--color-text-main); margin-top: 2px;">${item.value}</div>
              </div>
            </a>
          `;
        }).join('');
      } catch (e) {
        document.getElementById('contact-info-grid').innerHTML = `<div style="color: #f87171;">無法載入聯絡資訊。</div>`;
      }
    }

    async function handleContactSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('contact-submit-btn');
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner"></span> 傳送中...`;

      const formData = new FormData(e.target);
      const payload = {
        name: formData.get('name'),
        email: formData.get('email'),
        phone: formData.get('phone') || '',
        description: formData.get('description') || ''
      };

      try {
        const res = await apiFetch('/api/submit_form', {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        alert('感謝您的留言諮詢！我們將儘快指派專人與您聯繫。');
        e.target.reset();
      } catch (err) {
        alert('傳送失敗，請稍微重試或直接與我們聯絡。');
      } finally {
        btn.disabled = false;
        btn.innerText = '送出訊息';
      }
    }

    // --- CART & CHECKOUT SYSTEM ---
    function toggleCartDrawer(open) {
      const drawer = document.getElementById('cart-drawer');
      if (open) {
        drawer.classList.add('active');
        loadShopInfoIfNeeded();
        updateCartView();
      } else {
        drawer.classList.remove('active');
      }
    }

    function addToCart(productId, qty = 1) {
      const product = state.products.find(p => p.id === productId) || state.currentDetailProduct;
      if (!product) return;

      const existing = state.cart.find(i => i.id === productId);
      const currentQty = existing ? existing.qty : 0;
      const newQty = currentQty + qty;

      if (product.is_stock_tracked && product.stock_quantity !== null && newQty > product.stock_quantity) {
        alert(`庫存不足，該商品最多可購買 ${product.stock_quantity} 件。`);
        return;
      }

      if (existing) {
        existing.qty = newQty;
      } else {
        state.cart.push({
          id: product.id,
          name: product.name,
          price: Number(product.price),
          image: (product.images && product.images.length > 0) ? product.images[0] : '',
          qty: qty,
          stock_quantity: product.stock_quantity,
          is_stock_tracked: product.is_stock_tracked
        });
      }

      updateCartBadge();
      toggleCartDrawer(true);
    }

    function addToCartFromDetail(id) {
      const qtyInput = document.getElementById('detail-qty-input');
      const qty = parseInt(qtyInput ? qtyInput.value : 1);
      addToCart(id, qty);
      closeProductModal();
    }

    function buyNow(productId) {
      addToCart(productId, 1);
      toggleCartDrawer(true);
    }

    function updateCartItemQty(id, delta) {
      const item = state.cart.find(i => i.id === id);
      if (!item) return;
      const newQty = item.qty + delta;

      if (newQty <= 0) {
        state.cart = state.cart.filter(i => i.id !== id);
      } else {
        if (item.is_stock_tracked && item.stock_quantity !== null && newQty > item.stock_quantity) {
          alert(`庫存上限為 ${item.stock_quantity} 件`);
          return;
        }
        item.qty = newQty;
      }
      updateCartBadge();
      updateCartView();
    }

    function toggleUpsell() {
      state.upsellAdded = !state.upsellAdded;
      updateCartView();
    }

    function updateCartView() {
      const container = document.getElementById('cart-items-container');
      const summaryArea = document.getElementById('cart-summary-area');

      if (state.cart.length === 0) {
        container.innerHTML = `<div style="text-align: center; color: var(--color-text-muted); margin-top: 3rem;">您的購物車是空的</div>`;
        summaryArea.innerHTML = '';
        return;
      }

      container.innerHTML = state.cart.map(item => `
        <div class="cart-item">
          <img class="cart-item-img" src="${item.image || 'https://via.placeholder.com/70'}" alt="${item.name}">
          <div style="flex:1;">
            <div style="font-weight: 600; font-size: 0.95rem;">${item.name}</div>
            <div style="color: var(--color-accent); font-size: 0.9rem; margin-top: 2px;">NT$ ${item.price.toLocaleString()}</div>
            <div class="qty-picker" style="margin: 6px 0 0 0;">
              <button class="qty-btn" onclick="updateCartItemQty('${item.id}', -1)">-</button>
              <span style="font-size: 0.9rem; min-width: 20px; text-align: center;">${item.qty}</span>
              <button class="qty-btn" onclick="updateCartItemQty('${item.id}', 1)">+</button>
            </div>
          </div>
          <button style="background:none; border:none; color: var(--color-secondary); cursor:pointer;" onclick="updateCartItemQty('${item.id}', -${item.qty})">&times;</button>
        </div>
      `).join('');

      // Subtotal calculation
      let subtotal = state.cart.reduce((sum, item) => sum + item.price * item.qty, 0);
      if (state.upsellAdded) subtotal += 299;

      // Settings from shopInfo
      const settings = (state.shopInfo && state.shopInfo.payment_settings) || {};
      const disablePayment = settings.disable_payment === true;
      const shippingFeeSetting = settings.shipping_fee !== undefined ? settings.shipping_fee : 65;
      const threshold = settings.free_shipping_threshold;

      let isFreeShipping = false;
      if (threshold && threshold > 0 && subtotal > threshold) {
        isFreeShipping = true;
      }

      const shippingFee = isFreeShipping ? 0 : shippingFeeSetting;
      const total = subtotal + shippingFee;

      // Free shipping progress HTML
      let freeShippingHTML = '';
      if (threshold && threshold > 0) {
        const diff = threshold - subtotal;
        if (diff > 0) {
          const percent = Math.min(100, Math.round((subtotal / threshold) * 100));
          freeShippingHTML = `
            <div class="free-shipping-bar">
              <div>再消費 <strong style="color: var(--color-primary);">NT$ ${diff.toLocaleString()}</strong> 即可享免運優惠！</div>
              <div class="progress-track"><div class="progress-fill" style="width: ${percent}%;"></div></div>
            </div>
          `;
        } else {
          freeShippingHTML = `<div class="free-shipping-bar" style="color: #4ade80;">✓ 已達全店免運門檻！</div>`;
        }
      }

      // Upsell Checkbox HTML
      const upsellHTML = `
        <div class="upsell-box">
          <input type="checkbox" id="upsell-check" ${state.upsellAdded ? 'checked' : ''} onchange="toggleUpsell()" style="cursor:pointer; width:16px; height:16px; accent-color: var(--color-primary);">
          <label for="upsell-check" style="font-size: 0.85rem; cursor:pointer; color: var(--color-text-main);">
            <strong style="color: var(--color-accent);">+$299 加購</strong> 專屬量酒器與調香專屬食譜卡
          </label>
        </div>
      `;

      // Payment Methods Enabled
      const isCreditEnabled = settings.is_credit_card_enabled !== false;
      const isBankEnabled = settings.is_bank_transfer_enabled !== false;

      summaryArea.innerHTML = `
        ${freeShippingHTML}
        ${upsellHTML}
        
        <div style="font-size: 0.9rem; margin-bottom: 8px;">
          <div style="display:flex; justify-between; margin-bottom: 4px;">
            <span style="color: var(--color-text-muted);">商品小計</span>
            <span>NT$ ${subtotal.toLocaleString()}</span>
          </div>
          <div style="display:flex; justify-between; margin-bottom: 4px;">
            <span style="color: var(--color-text-muted);">運費</span>
            <span>${shippingFee === 0 ? '<span style="color:#4ade80">免運</span>' : `NT$ ${shippingFee}`}</span>
          </div>
          <div style="display:flex; justify-between; font-size: 1.1rem; font-weight: bold; margin-top: 8px; border-top: 1px dashed var(--color-surface-border); padding-top: 8px;">
            <span style="color: var(--color-primary);">總計</span>
            <span style="color: var(--color-accent);">NT$ ${total.toLocaleString()}</span>
          </div>
        </div>

        ${disablePayment ? `
          <div style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; text-align: center; padding: 10px; border-radius: 6px; font-size: 0.85rem; margin-top: 1rem;">
            目前本店購物與結帳功能暫停開放
          </div>
        ` : `
          <form id="checkout-form" onsubmit="handleCheckout(event, ${total}, ${shippingFee})" style="margin-top: 1rem;">
            <div class="form-group">
              <label class="form-label">訂購人姓名 *</label>
              <input type="text" class="form-input" name="cust_name" required placeholder="王大明">
            </div>
            <div class="form-group">
              <label class="form-label">手機號碼 *</label>
              <input type="tel" class="form-input" name="cust_phone" required placeholder="0912345678">
            </div>
            <div class="form-group">
              <label class="form-label">寄送地址 *</label>
              <input type="text" class="form-input" name="cust_address" required placeholder="縣市 區域 街道門牌號碼">
            </div>
            <div class="form-group">
              <label class="form-label">Email (接收電子發票與通知)</label>
              <input type="email" class="form-input" name="cust_email" placeholder="example@email.com">
            </div>
            <div class="form-group">
              <label class="form-label">付款方式 *</label>
              <select class="form-input" name="payment_method" required style="cursor:pointer;">
                ${isCreditEnabled ? `<option value="credit_card">線上信用卡付款</option>` : ''}
                ${isBankEnabled ? `<option value="bank_transfer">實體/網路銀行轉帳</option>` : ''}
              </select>
            </div>
            <button type="submit" id="checkout-submit-btn" class="btn-primary" style="width: 100%; margin-top: 10px;">
              立即安全結帳 NT$ ${total.toLocaleString()}
            </button>
          </form>
        `}
      `;
    }

    async function handleCheckout(e, totalAmount, shippingFee) {
      e.preventDefault();
      const btn = document.getElementById('checkout-submit-btn');
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner"></span> 建立訂單中...`;

      const form = e.target;
      const formData = new FormData(form);
      const paymentMethod = formData.get('payment_method');

      // Construct item desc & items array
      const itemsPayload = state.cart.map(i => ({
        id: i.id,
        name: i.name,
        price: i.price,
        qty: i.qty
      }));

      if (state.upsellAdded) {
        itemsPayload.push({
          id: 'upsell_kit',
          name: '專屬量酒器與專屬食譜卡',
          price: 299,
          qty: 1
        });
      }

      if (shippingFee > 0) {
        itemsPayload.push({
          id: 'shipping_fee',
          name: '運費',
          price: shippingFee,
          qty: 1
        });
      }

      const itemDesc = itemsPayload.map(i => `${i.name} x ${i.qty}`).join(', ');

      const payload = {
        amount: totalAmount,
        item_desc: itemDesc,
        payment_method: paymentMethod,
        items: itemsPayload,
        customer_data: {
          name: formData.get('cust_name'),
          phone: formData.get('cust_phone'),
          address: formData.get('cust_address'),
          email: formData.get('cust_email') || ''
        }
      };

      try {
        const res = await apiFetch('/api/create-payment', {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        // Clear Cart
        state.cart = [];
        state.upsellAdded = false;
        updateCartBadge();

        if (paymentMethod === 'credit_card' && res.newebpay_url) {
          // Dynamic form submission to Newebpay MPG
          const formEl = document.createElement('form');
          formEl.method = 'POST';
          formEl.action = res.newebpay_url;

          const params = {
            MerchantID: res.MerchantID,
            TradeInfo: res.TradeInfo,
            TradeSha: res.TradeSha,
            Version: res.Version || '2.0'
          };

          for (const [key, value] of Object.entries(params)) {
            const hiddenField = document.createElement('input');
            hiddenField.type = 'hidden';
            hiddenField.name = key;
            hiddenField.value = value;
            formEl.appendChild(hiddenField);
          }

          document.body.appendChild(formEl);
          formEl.submit();
        } else if (paymentMethod === 'bank_transfer') {
          toggleCartDrawer(false);
          openBankModal();
        } else {
          alert('訂單建立成功！');
          toggleCartDrawer(false);
        }
      } catch (err) {
        alert('購物流程出現錯誤，請重新整理網頁再次嘗試。');
        btn.disabled = false;
        btn.innerText = `立即安全結帳 NT$ ${totalAmount.toLocaleString()}`;
      }
    }

    function openBankModal() {
      const modal = document.getElementById('bank-modal');
      const box = document.getElementById('bank-info-box');
      const settings = (state.shopInfo && state.shopInfo.payment_settings) || {};

      box.innerHTML = `
        <div style="margin-bottom: 8px;"><strong>銀行名稱：</strong> ${settings.bank_name || '請聯繫客服專員'}</div>
        <div style="margin-bottom: 8px;"><strong>戶名：</strong> ${settings.bank_account_name || '醒香微醺有限公司'}</div>
        <div><strong>銀行帳號：</strong> <span style="color: var(--color-primary); font-family: monospace; font-size: 1.1rem;">${settings.bank_account_number || '請聯繫客服專員'}</span></div>
      `;
      modal.classList.add('active');
    }

    function closeBankModal() {
      document.getElementById('bank-modal').classList.remove('active');
      switchTab('home');
    }

    // --- INITIALIZATION ---
    window.addEventListener('DOMContentLoaded', () => {
      updateCartBadge();
      switchTab('home');
    });
  </script>
</body>
</html>
