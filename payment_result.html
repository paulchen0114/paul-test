<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>付款結果 | 醒香微醺 SoberBloom</title>
  <style>
    :root {
      --color-primary: #D4AF37;
      --color-primary-hover: #B89628;
      --color-secondary: #71717A;
      --color-bg: #09090B;
      --color-surface: #18181B;
      --color-surface-border: #27272A;
      --color-text-main: #F4F4F5;
      --color-text-muted: #A1A1AA;
      --color-accent: #E5C158;
      --color-success: #22c55e;
      --color-danger: #ef4444;
      --radius-card: 12px;
      --radius-button: 8px;
      --shadow-modal: 0 25px 60px rgba(0,0,0,0.85);
      --shadow-glow: 0 0 25px rgba(212,175,55,0.25);
      --font-family: 'Georgia', 'Palatino Linotype', 'Noto Serif TC', serif, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--color-bg);
      color: var(--color-text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
      position: relative;
    }

    #bgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      pointer-events: none;
    }

    /* Result Card Layout */
    .result-card {
      background: rgba(24, 24, 27, 0.85);
      border: 1px solid var(--color-surface-border);
      backdrop-filter: blur(16px);
      border-radius: var(--radius-card);
      width: 100%;
      max-width: 480px;
      padding: 40px 32px;
      box-shadow: var(--shadow-modal);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      animation: fadeInScale 0.5s ease-out forwards;
    }

    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: scale(0.92) translateY(15px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .brand-header {
      margin-bottom: 24px;
    }

    .brand-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--color-primary);
      line-height: 1.2;
    }

    .brand-subtitle {
      font-size: 0.65rem;
      letter-spacing: 0.25em;
      color: var(--color-text-muted);
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* Status Icon Animations */
    .icon-container {
      width: 80px;
      height: 80px;
      margin: 10px 0 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .status-svg {
      width: 100%;
      height: 100%;
    }

    .circle-bg {
      stroke-dasharray: 283;
      stroke-dashoffset: 283;
      animation: strokeCircle 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards 0.2s;
    }

    .check-mark, .cross-mark {
      stroke-dasharray: 100;
      stroke-dashoffset: 100;
      animation: strokeCheck 0.4s cubic-bezier(0.65, 0, 0.45, 1) forwards 0.7s;
    }

    @keyframes strokeCircle {
      to {
        stroke-dashoffset: 0;
      }
    }

    @keyframes strokeCheck {
      to {
        stroke-dashoffset: 0;
      }
    }

    /* Status Text & Elements */
    .status-title {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .status-title.success {
      color: var(--color-primary);
    }

    .status-title.danger {
      color: var(--color-danger);
    }

    .status-title.warning {
      color: var(--color-accent);
    }

    .status-subtitle {
      color: var(--color-text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .order-badge {
      background: rgba(212, 175, 55, 0.08);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 0.9rem;
      color: var(--color-accent);
      margin-bottom: 20px;
      word-break: break-all;
      width: 100%;
    }

    .message-box {
      background: rgba(255, 255, 255, 0.03);
      border-left: 3px solid var(--color-secondary);
      padding: 12px 16px;
      font-size: 0.85rem;
      color: var(--color-text-muted);
      text-align: left;
      border-radius: 4px;
      margin-bottom: 28px;
      width: 100%;
    }

    .message-box.error {
      border-left-color: var(--color-danger);
      background: rgba(239, 68, 68, 0.08);
      color: #fca5a5;
    }

    /* Buttons */
    .btn-group {
      display: flex;
      gap: 12px;
      width: 100%;
      margin-top: 8px;
    }

    .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 20px;
      border-radius: var(--radius-button);
      font-weight: 600;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid var(--color-primary);
      background-color: var(--color-primary);
      color: #000000;
      text-decoration: none;
      font-size: 0.95rem;
    }

    .btn:hover {
      background-color: var(--color-primary-hover);
      border-color: var(--color-primary-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-glow);
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--color-text-main);
      border-color: var(--color-surface-border);
    }

    .btn-secondary:hover {
      background-color: rgba(255, 255, 255, 0.05);
      border-color: var(--color-secondary);
      color: #ffffff;
    }

    @media (max-width: 480px) {
      .result-card {
        padding: 32px 20px;
      }
      .btn-group {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <!-- Background Dynamic Canvas -->
  <canvas id="bgCanvas"></canvas>

  <div class="result-card">
    <div class="brand-header">
      <div class="brand-title">醒香微醺</div>
      <div class="brand-subtitle">SoberBloom</div>
    </div>

    <div id="resultContent" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
      <!-- Dynamic Content Rendered Here -->
    </div>
  </div>

  <script>
    /* Dynamic Star Trails Background Algorithm */
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    let mouse = { x: width / 2, y: height / 2 };
    const particles = [];
    const colors = ["rgba(212,175,55,0.25)", "rgba(229,193,88,0.18)", "rgba(113,113,122,0.12)"];

    class StarParticle {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.radius = Math.random() * 1.5 + 0.5;
        this.color = colors[Math.floor(Math.random() * colors.length)];
        this.vx = (Math.random() - 0.5) * 0.3;
        this.vy = (Math.random() - 0.5) * 0.3;
        this.alpha = Math.random();
        this.alphaSpeed = 0.005 + Math.random() * 0.005;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.alpha += this.alphaSpeed;
        if (this.alpha > 1 || this.alpha < 0.1) this.alphaSpeed = -this.alphaSpeed;
        if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) this.reset();
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = '#D4AF37';
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    for (let i = 0; i < 40; i++) particles.push(new StarParticle());

    function animateCanvas() {
      ctx.clearRect(0, 0, width, height);
      const grad = ctx.createRadialGradient(mouse.x, mouse.y, 10, width/2, height/2, width*0.8);
      grad.addColorStop(0, 'rgba(212, 175, 55, 0.04)');
      grad.addColorStop(1, 'rgba(9, 9, 11, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateCanvas);
    }

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    animateCanvas();

    /* URL Query Parameter Logic & Rendering */
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const merchantOrderNo = urlParams.get('MerchantOrderNo');
      const status = urlParams.get('Status');
      const message = urlParams.get('Message');

      const container = document.getElementById('resultContent');

      // State 1: No Parameters
      if (!status && !merchantOrderNo) {
        container.innerHTML = `
          <div class="icon-container">
            <svg class="status-svg" viewBox="0 0 100 100">
              <circle class="circle-bg" cx="50" cy="50" r="45" fill="none" stroke="var(--color-accent)" stroke-width="4"/>
              <text x="50" y="62" font-size="36" text-anchor="middle" fill="var(--color-accent)">?</text>
            </svg>
          </div>
          <h1 class="status-title warning">查無訂單資訊</h1>
          <p class="status-subtitle">未偵測到此筆交易之相關資料，請確認連結是否正確。</p>
          <div class="btn-group">
            <a href="index.html" class="btn">返回首頁</a>
          </div>
        `;
        return;
      }

      // State 2: Payment Success
      if (status === 'SUCCESS') {
        const messageHtml = message ? `<div class="message-box"><strong>金流訊息：</strong> ${escapeHtml(message)}</div>` : '';
        const orderHtml = merchantOrderNo ? `<div class="order-badge">訂單編號：${escapeHtml(merchantOrderNo)}</div>` : '';

        container.innerHTML = `
          <div class="icon-container">
            <svg class="status-svg" viewBox="0 0 100 100">
              <circle class="circle-bg" cx="50" cy="50" r="45" fill="none" stroke="var(--color-primary)" stroke-width="4"/>
              <path class="check-mark" fill="none" stroke="var(--color-primary)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" d="M28 52 L43 67 L72 35" />
            </svg>
          </div>
          <h1 class="status-title success">付款成功！</h1>
          <p class="status-subtitle">感謝您的訂購，我們已收到您的付款，專屬調飲組合將盡快為您準備與出貨。</p>
          ${orderHtml}
          ${messageHtml}
          <div class="btn-group">
            <a href="index.html" class="btn">返回首頁</a>
          </div>
        `;
      } 
      // State 3: Payment Failed
      else {
        const messageHtml = message ? `<div class="message-box error"><strong>失敗原因：</strong> ${escapeHtml(message)}</div>` : '';
        const orderHtml = merchantOrderNo ? `<div class="order-badge">訂單編號：${escapeHtml(merchantOrderNo)}</div>` : '';

        container.innerHTML = `
          <div class="icon-container">
            <svg class="status-svg" viewBox="0 0 100 100">
              <circle class="circle-bg" cx="50" cy="50" r="45" fill="none" stroke="var(--color-danger)" stroke-width="4"/>
              <path class="cross-mark" fill="none" stroke="var(--color-danger)" stroke-width="5" stroke-linecap="round" d="M35 35 L65 65 M65 35 L35 65" />
            </svg>
          </div>
          <h1 class="status-title danger">付款未完成</h1>
          <p class="status-subtitle">很抱歉，此次交易未能完成，請稍後再試或選擇其他付款方式。</p>
          ${orderHtml}
          ${messageHtml}
          <div class="btn-group">
            <button onclick="history.back()" class="btn btn-secondary">重新結帳</button>
            <a href="index.html" class="btn">返回首頁</a>
          </div>
        `;
      }
    });

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
